[package]
name = "datim-connect"
version = "0.1.0"
edition = "2021"
description = "Compagnon bureau de démonstration DATIM CONNECT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
ttf-parser = "0.25"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 2
